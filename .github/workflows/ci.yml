# Pruebas en cada push y pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa==2.8
      - name: Pruebas del pipeline
        run: python -m unittest discover -s pipeline/tests -v
      - name: Pruebas del addon (Lua 5.1 con la API simulada)
        run: python -m unittest discover -s tests -v
      - name: Datos generados al día
        run: python pipeline/build_data.py --check

  luacheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lunarmodules/luacheck@v1
        with:
          args: ForeverProgressionGuide
